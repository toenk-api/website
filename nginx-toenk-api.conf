# TOENK Website Deployment — Nginx Config
# Place at: /etc/nginx/sites-available/toenk-api
# Then: ln -s /etc/nginx/sites-available/toenk-api /etc/nginx/sites-enabled/

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name toenk-api.com www.toenk-api.com;

    # Let's Encrypt验证
    location /.well-known/acme-challenge/ {
        root /var/www/toenk;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name toenk-api.com www.toenk-api.com;

    # SSL
    ssl_certificate /etc/letsencrypt/live/toenk-api.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toenk-api.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security — no version leak
    server_tokens off;
    more_clear_headers Server;
    more_clear_headers X-Powered-By;

    # Strip backend fingerprints
    proxy_hide_header X-New-Api-Version;
    proxy_hide_header X-Oneapi-Request-Id;
    proxy_hide_header Cache-Version;

    # Unified security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; frame-ancestors 'none';" always;

    # Static website root
    root /var/www/toenk;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    # Cache static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Language routing
    # /zh/ → Chinese site
    # /en/ → English site (default)
    # /    → detect Accept-Language, default to English

    location = / {
        # Language detection: Chinese browsers → /zh/, others → /en/
        if ($http_accept_language ~* "^zh") {
            return 302 /zh/;
        }
        return 302 /en/;
    }

    location /zh/ {
        try_files $uri $uri/ /zh/index.html =404;
    }

    location /en/ {
        try_files $uri $uri/ /en/index.html =404;
    }

    # Models page
    location /models {
        try_files $uri /models/index.html =404;
    }

    # Pricing page
    location /pricing {
        try_files $uri /pricing/index.html =404;
    }

    # Blog (static)
    location /blog {
        try_files $uri /blog/index.html =404;
    }

    # Playground
    location /playground {
        try_files $uri /playground/index.html =404;
    }

    # Security pages
    location /security {
        try_files $uri /security/index.html =404;
    }

    # About & Contact
    location /about { try_files $uri /about/index.html =404; }
    location /contact { try_files $uri /contact/index.html =404; }
    location /changelog { try_files $uri /changelog/index.html =404; }

    # Legal
    location /legal/ { try_files $uri =404; }

    # Robots & Sitemap (must be real files, not SPA)
    location = /robots.txt {
        alias /var/www/toenk/robots.txt;
        add_header Content-Type text/plain;
    }
    location = /sitemap.xml {
        alias /var/www/toenk/sitemap.xml;
        add_header Content-Type application/xml;
    }

    # Public API endpoints (no auth required)
    # Static JSON — update when models/pricing change
    location = /v1/models/public {
        alias /var/www/toenk/api/public-models.json;
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=300";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
        add_header Access-Control-Allow-Origin *;
    }

    # Favicon
    location = /favicon.svg {
        alias /var/www/toenk/favicon.svg;
        expires 30d;
    }

    # API proxy (if on same server)
    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        
        # Rate limiting for API
        limit_req zone=api_limit burst=20 nodelay;
    }

    # Console (NEW_API admin) — separate subdomain preferred
    # If on same domain, restrict access
    location /console/ {
        return 302 https://console.toenk-api.com$request_uri;
    }
}

# Rate limit zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# API subdomain (if same server)
server {
    listen 443 ssl http2;
    server_name api.toenk-api.com;

    ssl_certificate /etc/letsencrypt/live/toenk-api.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toenk-api.com/privkey.pem;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        limit_req zone=api_limit burst=50 nodelay;
    }
}

# Console subdomain (NEW_API admin)
server {
    listen 443 ssl http2;
    server_name console.toenk-api.com;

    ssl_certificate /etc/letsencrypt/live/toenk-api.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toenk-api.com/privkey.pem;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
