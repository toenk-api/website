name: Deploy Website
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to S1
        uses: appleboy/scp-action@v0.1.7
        with:
          host: \${{ secrets.S1_HOST }}
          username: \${{ secrets.SSH_USER }}
          key: \${{ secrets.SSH_KEY }}
          source: "index.html,zh/,models/,playground/,api/,robots.txt"
          target: "/var/www/toenk/"
      - name: Reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: \${{ secrets.S1_HOST }}
          username: \${{ secrets.SSH_USER }}
          key: \${{ secrets.SSH_KEY }}
          script: |
            cp /var/www/toenk/nginx-toenk-api.conf /etc/nginx/sites-available/toenk-api
            ln -sf /etc/nginx/sites-available/toenk-api /etc/nginx/sites-enabled/
            nginx -t && systemctl reload nginx
